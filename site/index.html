<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swedish Transit Map</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<aside id="panel">
  <header>
    <div class="title-row">
      <select id="region" aria-label="Region" data-i18n-aria-label="region"></select>
      <details class="settings" id="settings">
        <summary aria-label="Settings" title="Settings" data-i18n-aria-label="settings" data-i18n-title="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></summary>
        <div class="menu">
          <label><span data-i18n="settings.language">Language</span>
            <select id="lang"><option value="auto" data-i18n-auto>Automatic</option><option value="en" lang="en">English</option><option value="sv" lang="sv">Svenska</option></select></label>
          <label><span data-i18n="settings.theme">Theme</span>
            <select id="theme"><option value="auto" data-i18n="theme.auto">Follow system</option><option value="light" data-i18n="theme.light">Light</option><option value="dark" data-i18n="theme.dark">Dark</option></select></label>
        </div>
      </details>
      <button id="toggle" aria-label="Toggle panel" data-i18n-aria-label="panel.toggle">Hide</button>
    </div>
    <div class="sub" id="feed" data-i18n="loading">Loading timetable data…</div>
    <div class="modes" id="modes"></div>
    <label class="weekly" title="Hide lines without at least one trip in every regular week of the timetable's first eight weeks (holiday weeks are not counted): one-off, seasonal and occasional services" data-i18n-title="weekly.title"><input type="checkbox" id="weekly" checked> <span data-i18n="weekly">Only lines that run every week</span> <span class="n" id="weekly-n"></span></label>
    <div id="time" class="off">
      <div class="top">
        <label class="chk"><input type="checkbox" id="time-on"> <span data-i18n="time.running">Running between</span></label>
        <span class="range-label" id="time-label"></span>
      </div>
      <div class="days" id="days">
        <button data-day="wd" aria-pressed="true" data-i18n="day.wd">Weekday</button><button data-day="sa" aria-pressed="false" data-i18n="day.sa">Saturday</button><button data-day="su" aria-pressed="false" data-i18n="day.su">Sunday</button>
      </div>
      <div class="dual">
        <div class="rail"></div><div class="fill" id="time-fill"></div>
        <input type="range" id="time-from" min="16" max="112" step="1" value="28" aria-label="From time" data-i18n-aria-label="time.from">
        <input type="range" id="time-to" min="16" max="112" step="1" value="36" aria-label="To time" data-i18n-aria-label="time.to">
      </div>
      <div class="ticks"><span>04</span><span>08</span><span>12</span><span>16</span><span>20</span><span>24</span><span>04</span></div>
      <div class="hint" id="time-hint"></div>
    </div>
    <input id="search" type="search" placeholder="Search line or stop…" data-i18n-placeholder="search" autocomplete="off">
  </header>
  <div id="view"></div>
</aside>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>

name: Deploy to GitHub Pages

# The site is fully static: site/ (index.html, app.js, style.css and the built data) is published as is.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  # Data commits from the weekly update are pushed with GITHUB_TOKEN, which doesn't trigger push
  # workflows, so deploy when that workflow finishes instead.
  workflow_run:
    workflows: ["Update transit data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # After a data update, deploy the branch as it is now (the run pushed its commit after starting).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
